
<style>
.premium-filters {
  background: linear-gradient(135deg,#101d35,#1b3150);
  padding: 25px;
  border-radius: 22px;
  display: grid;
  grid-template-columns: repeat(2,minmax(0,1fr));
  gap: 14px;
  box-shadow: 0 15px 35px rgba(16,29,53,.15);
  margin: 25px 0;
}
.premium-filters .filter-heading {
  grid-column: 1/-1;
  color: white;
}
.premium-filters .filter-heading h3 {
  font-size: 23px;
  margin: 0 0 6px;
}
.premium-filters .filter-heading p {
  color: #c5d0e1;
  font-size: 13px;
  margin: 0;
}
.premium-filters input,
.premium-filters select {
  width: 100%;
  min-width: 0;
  padding: 15px 13px;
  border: 1px solid #e3e9f1;
  border-radius: 12px;
  background: #fff;
  color: #17243b;
  outline: none;
  font-size: 14px;
}
.premium-filters input:focus,
.premium-filters select:focus {
  border-color: #39d6a0;
  box-shadow: 0 0 0 3px #39d6a033;
}
.premium-filters .wide {
  grid-column: 1/-1;
}
.premium-filters button {
  width: 100%;
  padding: 15px;
  border: 0;
  border-radius: 12px;
  background: #20bd8b;
  color: #082c27;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
  transition: .2s;
}
.premium-filters button:hover {
  background: #39d6a0;
  transform: translateY(-2px);
}
.filter-note {
  grid-column: 1/-1;
  color: #c5d0e1;
  font-size: 11px;
  line-height: 1.5;
}
@media(max-width:600px) {
  .premium-filters {
    padding: 17px;
    gap: 11px;
  }
  .premium-filters input,
  .premium-filters select {
    font-size: 13px;
    padding: 13px 9px;
  }
}
</style>

<div class="premium-filters">
  <div class="filter-heading">
    <h3>Find Your Perfect Job</h3>
    <p>Explore career opportunities across Pakistan.</p>
  </div>

  <input class="wide" id="portalSearch" type="search"
    placeholder="Search job title, skill or department...">

  <select id="regionFilter" onchange="updateCities()">
    <option value="">All Provinces / Regions</option>
    <option value="federal">Islamabad / Federal</option>
    <option value="punjab">Punjab</option>
    <option value="kpk">Khyber Pakhtunkhwa</option>
    <option value="sindh">Sindh</option>
    <option value="balochistan">Balochistan</option>
    <option value="ajk">Azad Kashmir</option>
    <option value="gb">Gilgit-Baltistan</option>
  </select>

  <select id="cityFilter">
    <option value="">All Cities</option>
  </select>

  <select id="categoryFilter">
    <option value="">All Categories</option>
    <option value="it">IT & Software</option>
    <option value="healthcare">Healthcare</option>
    <option value="education">Education</option>
    <option value="administration">Administration</option>
    <option value="customer-service">Customer Service</option>
    <option value="sales">Sales & Marketing</option>
    <option value="engineering">Engineering</option>
  </select>

  <select id="jobTypeFilter">
    <option value="">All Job Types</option>
    <option value="full-time">Full Time</option>
    <option value="part-time">Part Time</option>
    <option value="remote">Remote</option>
    <option value="internship">Internship</option>
    <option value="government">Government</option>
    <option value="private">Private</option>
  </select>

  <button class="wide" onclick="premiumSearchJobs()">
    Search Opportunities →
  </button>

  <div class="filter-note">
    Select your preferred location and career category to narrow your search.
  </div>
</div>

<script>
const cityOptions = {
  federal: ["Islamabad"],
  punjab: ["Rawalpindi","Lahore","Faisalabad","Multan","Gujranwala","Sialkot","Gujrat"],
  kpk: ["Peshawar","Abbottabad","Mansehra","Kohat","Mardan","Swat"],
  sindh: ["Karachi","Hyderabad","Sukkur","Larkana"],
  balochistan: ["Quetta","Gwadar","Turbat","Khuzdar"],
  ajk: ["Muzaffarabad","Mirpur","Kotli"],
  gb: ["Gilgit","Skardu","Hunza"]
};

function updateCities() {
  const region = document.getElementById("regionFilter").value;
  const city = document.getElementById("cityFilter");
  city.innerHTML = '<option value="">All Cities</option>';

  (cityOptions[region] || []).forEach(name => {
    const option = document.createElement("option");
    option.value = name.toLowerCase().replace(/\s+/g,"-");
    option.textContent = name;
    city.appendChild(option);
  });
}

function premiumSearchJobs() {
  const query = document.getElementById("portalSearch").value.toLowerCase().trim();
  const region = document.getElementById("regionFilter").value;
  const city = document.getElementById("cityFilter").value;
  const category = document.getElementById("categoryFilter").value;
  const jobType = document.getElementById("jobTypeFilter").value;

  document.querySelectorAll("#jobList .job-card").forEach(card => {
    const matches =
      card.innerText.toLowerCase().includes(query) &&
      (!region || card.dataset.region === region) &&
      (!city || card.dataset.city === city) &&
      (!category || card.dataset.category === category) &&
      (!jobType || card.dataset.jobtype === jobType);

    card.style.display = matches ? "" : "none";
  });

  document.getElementById("jobList").scrollIntoView({
    behavior: "smooth",
    block: "start"
  });
}
</script>
